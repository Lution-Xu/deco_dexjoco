model_name: deco_dexjoco
model:
  action_dim: 44
  obs_dim: 46
  chunk_size: 16
  obs_state: True
  use_task_condition: True
  num_tasks: 5
  num_cameras: 3
  use_tactile: False
  plugin: False
  num_attn_blocks: 6
  inf_step: 5
  heads: 8
  dim: 512
  rope_axes_dim: [256, 256]
  pretrain_model_path: False
  adapter_model_path: False
data:
  chunk_size: 16
  norm_type: mean_std
  image_root: /root/xz/deco/datasets/dexjoco_dataset/dexjoco_images/rand_full
  image_ext: jpg
  data_root: /root/xz/deco/datasets/dexjoco_dataset
  task_group: dual
  # Optional: uncomment one task for single-task training, and use a unique
  # task-specific stats_path below.
  # task: bimanual_hanoi
  regime: rand_full
  # With the task above enabled, replace this with e.g.
  # /home/xz/deco/IL_training_codebase-master/config/dexjoco_stats_bimanual_hanoi_rand_full.json
  stats_path: /root/xz/deco/IL_training_codebase-master/config/dexjoco_stats_dual_rand_full.json
img:
  img_size: [256, 256]
  img_mean: [0.485, 0.456, 0.406]
  img_std: [0.229, 0.224, 0.225]
